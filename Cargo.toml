[package]
name = "everywhere"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local document indexer and search GUI"
license = "MIT"

[dependencies]
eframe = "0.24"
egui = "0.24"
tantivy = "0.22"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.12"
opener = "0.6"
pdf-extract = "0.7"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
regex = "1.10"
parking_lot = "0.12"
"pulldown-cmark" = "0.12.2"

[[bin]]
name = "everywhere"
path = "src/main.rs"
